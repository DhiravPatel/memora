[project]
name = "ai-memory-layer"
version = "0.1.0"
description = "Persistent memory infrastructure for AI-powered SaaS."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.2",
    "pgvector>=0.3.2",
    "redis>=5.0.8",
    "arq>=0.26.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "prometheus-client>=0.20.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "anyio>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Editable installs expose these roots on sys.path (app/, worker/, and the shared packages).
dev-mode-dirs = ["packages", "apps/api", "apps"]
packages = [
    "packages/common",
    "packages/database",
    "packages/nlp",
    "packages/integrations",
    "packages/webhooks",
    "packages/memory_engine",
    "apps/api/app",
    "apps/worker",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages", "apps/api", "apps"]
markers = [
    "integration: requires PostgreSQL and Redis",
    "e2e: full end-to-end flow",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "apps/api", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
mypy_path = "packages:apps/api:apps"
