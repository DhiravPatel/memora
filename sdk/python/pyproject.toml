[project]
name = "ai-memory"
version = "0.1.0"
description = "Python SDK for the AI Memory Layer — persistent customer memory for AI agents."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "respx>=0.21.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_memory"]
